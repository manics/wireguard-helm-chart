apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "wireguard.fullname" . }}-test"
  labels:
    {{- include "wireguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  serviceAccountName: "{{ include "wireguard.fullname" . }}-test"
  containers:
    {{- if .Values.healthcheck.enabled }}
    - name: httphealthcheck
      image: docker.io/library/busybox
      command:
        - wget
      args:
        - '{{ include "wireguard.fullname" . }}:{{ .Values.service.healthcheckPort }}'
    {{- end }}
    {{- range (split "," .Values.wireguard.clientPeers) }}
    - name: peerconfig-{{ . }}
      image: docker.io/alpine/k8s:1.34.0
      command:
        - kubectl
      args:
        - exec
        - deploy/{{ include "wireguard.fullname" $ }}
        - -c
        - wireguard
        - --
        - cat
        - /config/peer_{{ . }}/peer_{{ . }}.conf
    {{- end }}
  restartPolicy: Never
